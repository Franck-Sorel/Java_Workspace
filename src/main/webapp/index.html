<!DOCTYPE html>
<html>

<head>
    <title>Library App</title>

        body { font-family: Arial; margin: 20px; }

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
            color: #333;
            transition: background-color 0.3s, color 0.3s;
        }

        .dark-mode {
            background-color: #222;
            color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 12px;
            border: none;
            background-color: #007BFF;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #book-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .book {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
            position: relative;
        }

        .dark-mode .book {
            background-color: #333;
            border-color: #444;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            border: none;
            color: white;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 3px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        #counter {
            text-align: center;
            margin-bottom: 10px;
        }

        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- <h1>Library</h1>
    <input id="title" placeholder="Title">
    <input id="author" placeholder="Author">
    <button onclick="addBook()">Add Book</button>
    <div id="book-list"></div> -->
    <button id="theme-toggle">Toggle Theme</button>
    <h1>Library</h1>

    <div class="form">
        <input id="title" placeholder="Title">
        <input id="author" placeholder="Author">
        <button onclick="addBook()">Add Book</button>
        <button onclick="clearForm()">Reset</button>
    </div>

    <div id="counter">Books: 0</div>
    <div id="book-list"></div>
    <script src="js/app.js"></script>
</body>

</html>
